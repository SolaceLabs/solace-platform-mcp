name: SCA Scan
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  packages: read
  actions: read
  statuses: write
  checks: write
  pull-requests: write

jobs:
  sca_scan:
    strategy:
      matrix:
        include:
          - { path: ., name: solace-platform-mcp }
          - { path: solace-event-portal-designer-mcp, name: solace-event-portal-designer-mcp }
          - { path: solace-monitoring-mcp-server, name: solace-monitoring-mcp-server }
    uses: SolaceDev/solace-public-workflows/.github/workflows/sca-scan-and-guard.yaml@main
    with:
      setup_actions: '["setup-uv"]'
      additional_scan_params: |
        fossa.only_path=${{ matrix.path }}
    secrets:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}

  update_manifest:
    needs: sca_scan
    # The manifest records what landed on the default branch, so it must never
    # be written from a PR run -- the scan still runs, the write does not.
    if: >-
      needs.sca_scan.result == 'success'
      && github.event_name == 'push'
      && github.ref_name == github.event.repository.default_branch
    strategy:
      matrix:
        include:
          - { path: ., name: solace-platform-mcp }
          - { path: solace-event-portal-designer-mcp, name: solace-event-portal-designer-mcp }
          - { path: solace-monitoring-mcp-server, name: solace-monitoring-mcp-server }
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::868978040651:role/github-solace-cloud-manifest-rw
          aws-region: us-east-1

      - name: Update solace-cloud-manifest
        uses: SolaceDev/solace-public-workflows/.github/actions/cicd-helper@main
        with:
          rc_step: add_item_from_json_to_dynamodb_table
          ddb_table_name: solace-cloud-manifest
          ddb_partition_key: squad
          ddb_sort_key: repository
          ddb_item_to_be_added: |
            {
              "squad": "event-portal",
              "repository": "${{ matrix.name }}",
              "dev": {
                "sha": "${{ github.sha }}",
                "version": "${{ github.ref_name }}"
              }
            }
